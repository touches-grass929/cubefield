<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubefield 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #dcdcdc;
            font-family: 'Lexend', sans-serif;
            transition: background-color 0.4s ease;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 24px;
            left: 32px;
            right: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            color: #1a1a1a;
            transition: color 0.4s ease;
        }
        .stat-group {
            display: flex;
            gap: 36px;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            opacity: 0.6;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        #level-banner {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.35s ease;
        }
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(235, 235, 235, 0.75);
            backdrop-filter: blur(6px);
            z-index: 20;
            color: #111111;
            transition: opacity 0.25s ease;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: clamp(44px, 7vw, 72px);
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        #subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 32px;
            text-align: center;
            padding: 0 20px;
        }
        #play-btn {
            background: #e62e00;
            color: #ffffff;
            border: 2px solid #111111;
            padding: 14px 46px;
            font-family: 'Lexend', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #111111;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        #play-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #111111;
        }
        #play-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #111111;
        }
        .controls-hint {
            position: absolute;
            bottom: 26px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0.65;
            letter-spacing: 1.5px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        <div class="stat-group">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Level</span>
                <span class="stat-value" id="level">1</span>
            </div>
        </div>
        <div class="stat-box" style="text-align: right;">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="highscore">0</span>
        </div>
    </div>

    <div id="level-banner">LEVEL 2</div>

    <div id="overlay">
        <h1 id="title">CUBEFIELD</h1>
        <p id="subtitle">Dodge the cubes • Speed increases every 1,000 points</p>
        <button id="play-btn">PLAY</button>
        <div class="controls-hint">LEFT / RIGHT ARROWS &nbsp;•&nbsp; A / D &nbsp;•&nbsp; TOUCH SIDES</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const highscoreEl = document.getElementById('highscore');
        const levelBanner = document.getElementById('level-banner');
        const overlay = document.getElementById('overlay');
        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');
        const playBtn = document.getElementById('play-btn');
        const hudEl = document.getElementById('hud');

        // Single Distinct Cube Color Per Level (Changes every 1,000 points)
        const LEVELS = [
            // Level 1 (0 - 999): Solid Red Cubes on Light Gray
            {
                sky: 0xdcdcdc,
                floor: 0xf4f4f4,
                cube: 0xe62e00,
                edge: 0x222222,
                ship: 0x1a1a1a,
                ui: '#1a1a1a'
            },
            // Level 2 (1000 - 1999): Solid Neon Green Cubes on Black
            {
                sky: 0x050505,
                floor: 0x0a0a0a,
                cube: 0x39ff14,
                edge: 0x003300,
                ship: 0xffffff,
                ui: '#39ff14'
            },
            // Level 3 (2000 - 2999): Solid Pitch Black Cubes on White
            {
                sky: 0xffffff,
                floor: 0xf7f7f7,
                cube: 0x111111,
                edge: 0x555555,
                ship: 0xe62e00,
                ui: '#111111'
            },
            // Level 4 (3000 - 3999): Solid Electric Cyan Cubes on Deep Navy
            {
                sky: 0x071324,
                floor: 0x0b1c36,
                cube: 0x00d4ff,
                edge: 0x020812,
                ship: 0xffffff,
                ui: '#00d4ff'
            },
            // Level 5 (4000+): Solid Bright Gold Cubes on Dark Charcoal
            {
                sky: 0x141414,
                floor: 0x1c1c1c,
                cube: 0xffcc00,
                edge: 0x000000,
                ship: 0xffffff,
                ui: '#ffcc00'
            }
        ];

        // Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(LEVELS[0].sky);
        scene.fog = new THREE.Fog(LEVELS[0].sky, 50, 150);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 165);
        camera.position.set(0, 2.6, 7.5);
        camera.lookAt(0, 1.0, -25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 40, 25);
        scene.add(dirLight);

        // Infinite Ground Plane
        const floorGeo = new THREE.PlaneGeometry(800, 800);
        const floorMat = new THREE.MeshLambertMaterial({ color: LEVELS[0].floor });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Sleek Classic Triangle Pointer (Ship)
        const shipGroup = new THREE.Group();
        const shipShape = new THREE.BufferGeometry();
        const vertices = new Float32Array([
             0.0, 0.16, -1.25,  // Nose
            -0.55, 0.08, 0.70,  // Left wing
             0.55, 0.08, 0.70,  // Right wing
             0.0, 0.30,  0.30   // Top ridge
        ]);
        const indices = [
            0, 1, 3,
            0, 3, 2,
            1, 2, 3,
            0, 2, 1
        ];
        shipShape.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        shipShape.setIndex(indices);
        shipShape.computeVertexNormals();

        const shipMat = new THREE.MeshLambertMaterial({ color: LEVELS[0].ship });
        const shipMesh = new THREE.Mesh(shipShape, shipMat);
        shipGroup.add(shipMesh);
        shipGroup.position.set(0, 0.15, 0);
        scene.add(shipGroup);

        // Balanced Cube Field Pool (Fixed count across all levels, open paths)
        const CUBE_SIZE = 2.0;
        const cubeGeo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
        const edgesGeo = new THREE.EdgesGeometry(cubeGeo);

        const cubes = [];
        const CUBE_COUNT = 135;      // Fixed density so paths stay open
        const SPAWN_WIDTH = 170;     // Wide lateral field
        const SPAWN_DEPTH = 150;     // Horizon spawn distance

        for (let i = 0; i < CUBE_COUNT; i++) {
            const mat = new THREE.MeshLambertMaterial({ color: LEVELS[0].cube });
            const mesh = new THREE.Mesh(cubeGeo, mat);

            const lineMat = new THREE.LineBasicMaterial({ color: LEVELS[0].edge });
            const wireframe = new THREE.LineSegments(edgesGeo, lineMat);
            mesh.add(wireframe);

            mesh.position.set(
                (Math.random() - 0.5) * SPAWN_WIDTH,
                CUBE_SIZE / 2,
                -30 - Math.random() * SPAWN_DEPTH
            );
            scene.add(mesh);
            cubes.push({ mesh, lineMat });
        }

        // Game State
        let isPlaying = false;
        let score = 0;
        let currentLevel = 1;
        let highScore = Number(localStorage.getItem('cubefield_classic_best')) || 0;
        highscoreEl.textContent = Math.floor(highScore);

        let forwardSpeed = 44;
        let currentSteerSpeed = 0;
        const keys = { left: false, right: false };
        let bannerTimeout = null;

        function applyLevelTheme(lvl, showBanner = false) {
            const palette = LEVELS[(lvl - 1) % LEVELS.length];
            scene.background.setHex(palette.sky);
            scene.fog.color.setHex(palette.sky);
            floorMat.color.setHex(palette.floor);
            shipMat.color.setHex(palette.ship);
            hudEl.style.color = palette.ui;
            levelBanner.style.color = palette.ui;

            cubes.forEach((item) => {
                item.mesh.material.color.setHex(palette.cube);
                item.lineMat.color.setHex(palette.edge);
            });

            if (showBanner) {
                levelBanner.textContent = `LEVEL ${lvl}`;
                levelBanner.style.opacity = '1';
                clearTimeout(bannerTimeout);
                bannerTimeout = setTimeout(() => {
                    levelBanner.style.opacity = '0';
                }, 1400);
            }
        }

        function startGame() {
            score = 0;
            currentLevel = 1;
            forwardSpeed = 44;
            currentSteerSpeed = 0;

            scoreEl.textContent = '0';
            levelEl.textContent = '1';
            applyLevelTheme(1, false);

            shipGroup.position.x = 0;
            shipGroup.rotation.z = 0;
            camera.position.x = 0;
            camera.rotation.z = 0;
            floor.position.x = 0;

            // Leave a clear runway right in front of the player at start
            cubes.forEach((item) => {
                let spawnX = (Math.random() - 0.5) * SPAWN_WIDTH;
                const spawnZ = -45 - Math.random() * SPAWN_DEPTH;
                if (spawnZ > -70 && Math.abs(spawnX) < 10) {
                    spawnX += spawnX >= 0 ? 12 : -12;
                }
                item.mesh.position.x = spawnX;
                item.mesh.position.z = spawnZ;
            });

            isPlaying = true;
            overlay.classList.add('hidden');
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('cubefield_classic_best', highScore);
                highscoreEl.textContent = highScore;
            }
            titleEl.textContent = 'GAME OVER';
            subtitleEl.innerHTML = `Score: <strong>${Math.floor(score)}</strong> &nbsp;•&nbsp; Reached <strong>Level ${currentLevel}</strong>`;
            playBtn.textContent = 'TRY AGAIN';
            overlay.classList.remove('hidden');
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (!isPlaying && (e.key === 'Enter' || e.key === ' ')) startGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        window.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const x = e.touches[0].clientX;
            if (x < window.innerWidth / 2) keys.left = true;
            else keys.right = true;
        });

        window.addEventListener('touchend', () => {
            keys.left = false;
            keys.right = false;
        });

        playBtn.addEventListener('click', startGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Main Game Loop
        const clock = new THREE.Clock();
        applyLevelTheme(1, false);

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            if (isPlaying) {
                // Score Progression (Gradual acceleration within level, speed jump on level-up)
                forwardSpeed += delta * 0.75;
                score += forwardSpeed * delta * 1.45;
                const displayScore = Math.floor(score);
                scoreEl.textContent = displayScore;

                // Level Up Every 1,000 Points (Increases speed, keeps cube count fixed)
                const calculatedLevel = Math.floor(displayScore / 1000) + 1;
                if (calculatedLevel > currentLevel) {
                    currentLevel = calculatedLevel;
                    levelEl.textContent = currentLevel;
                    forwardSpeed += 9.5; // Distinct speed boost per level
                    applyLevelTheme(currentLevel, true);
                }

                // Balanced, Fluid Steering (Not overly twitchy, not sluggish)
                const maxSteer = 34 + (currentLevel * 2.2);
                let targetSteer = 0;
                if (keys.left) targetSteer -= maxSteer;
                if (keys.right) targetSteer += maxSteer;

                // Smooth 14x interpolation gives natural weight without input lag
                currentSteerSpeed += (targetSteer - currentSteerSpeed) * Math.min(1, delta * 14);
                shipGroup.position.x += currentSteerSpeed * delta;
                floor.position.x = shipGroup.position.x;

                // Smooth Ship & Camera Banking
                const targetBank = -(currentSteerSpeed / maxSteer) * 0.36;
                shipGroup.rotation.z += (targetBank - shipGroup.rotation.z) * Math.min(1, delta * 13);
                camera.position.x = shipGroup.position.x;
                camera.rotation.z = shipGroup.rotation.z * 0.3;

                // Move Cubes & Recycle Ahead of Player's Trajectory
                const pathLeadOffset = currentSteerSpeed * 1.35;

                for (let i = 0; i < cubes.length; i++) {
                    const cube = cubes[i].mesh;
                    cube.position.z += forwardSpeed * delta;

                    // Recycle passed cubes or cubes far off-screen
                    if (cube.position.z > 9 || Math.abs(cube.position.x - shipGroup.position.x) > SPAWN_WIDTH * 0.6) {
                        cube.position.z = -SPAWN_DEPTH - Math.random() * 25;
                        cube.position.x = shipGroup.position.x + pathLeadOffset + (Math.random() - 0.5) * SPAWN_WIDTH;
                    }

                    // Tight, Forgiving Hitbox (Matches visual ship tip and narrow body)
                    const dz = cube.position.z - shipGroup.position.z;
                    const dx = Math.abs(cube.position.x - shipGroup.position.x);

                    if (dz > -1.35 && dz < 0.85 && dx < 0.88) {
                        gameOver();
                        break;
                    }
                }
            } else {
                // Title Screen Background Animation
                for (let i = 0; i < cubes.length; i++) {
                    const cube = cubes[i].mesh;
                    cube.position.z += 20 * delta;
                    if (cube.position.z > 9) {
                        cube.position.z = -SPAWN_DEPTH;
                        cube.position.x = (Math.random() - 0.5) * SPAWN_WIDTH;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
