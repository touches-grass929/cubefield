<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeField 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Lexend', sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 28px;
            left: 36px;
            right: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            letter-spacing: 2px;
            opacity: 0.65;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(9, 10, 15, 0.55);
            backdrop-filter: blur(8px);
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: clamp(42px, 7vw, 76px);
            font-weight: 800;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #subtitle {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 20px;
        }
        #play-btn {
            background: #ffffff;
            color: #090a0f;
            border: none;
            padding: 16px 48px;
            font-family: 'Lexend', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        #play-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 36px rgba(255, 255, 255, 0.4);
        }
        #play-btn:active {
            transform: translateY(0);
        }
        .controls-hint {
            position: absolute;
            bottom: 28px;
            font-size: 13px;
            opacity: 0.6;
            letter-spacing: 1.5px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        <div class="stat-box">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-box" style="text-align: right;">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="highscore">0</span>
        </div>
    </div>

    <div id="overlay">
        <h1 id="title">CUBEFIELD 3D</h1>
        <p id="subtitle">Steer around the cubes as speed and themes evolve</p>
        <button id="play-btn">PLAY</button>
        <div class="controls-hint">A / D &nbsp;•&nbsp; LEFT / RIGHT ARROWS &nbsp;•&nbsp; TOUCH SIDES</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // DOM Elements
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const overlay = document.getElementById('overlay');
        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');
        const playBtn = document.getElementById('play-btn');

        // Color Themes (shifts every 500 points like the 3D edition)
        const THEMES = [
            { bg: 0xf0f2f5, fog: 0xf0f2f5, floor: 0xffffff, grid: 0xd1d5db, cubes: [0xff4500, 0xff7b00, 0xffb703], ship: 0x111827, bloom: 0.15, ui: '#111827' },
            { bg: 0x090a0f, fog: 0x090a0f, floor: 0x0d1017, grid: 0x1e293b, cubes: [0x00f5d4, 0x00bbf9, 0xfee440], ship: 0xffffff, bloom: 0.75, ui: '#ffffff' },
            { bg: 0x120422, fog: 0x120422, floor: 0x19062e, grid: 0x3b0764, cubes: [0xff007f, 0x7928ca, 0x00dfd8], ship: 0xffffff, bloom: 0.85, ui: '#ffffff' },
            { bg: 0x0a0a0a, fog: 0x0a0a0a, floor: 0x111111, grid: 0x262626, cubes: [0xffffff, 0xa3a3a3, 0x525252], ship: 0xff3b30, bloom: 0.45, ui: '#ffffff' }
        ];

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(THEMES[0].bg);
        scene.fog = new THREE.FogExp2(THEMES[0].fog, 0.011);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 3.2, 8);
        camera.lookAt(0, 1, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Post-processing Bloom (Glow effect)
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            THEMES[0].bloom, // strength
            0.4,             // radius
            0.85             // threshold
        );
        composer.addPass(bloomPass);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(15, 30, 20);
        scene.add(dirLight);

        // Infinite Floor & Moving Grid
        const floorGeo = new THREE.PlaneGeometry(400, 400);
        const floorMat = new THREE.MeshStandardMaterial({ color: THEMES[0].floor, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(300, 75, THEMES[0].grid, THEMES[0].grid);
        gridHelper.position.y = 0.02;
        scene.add(gridHelper);

        // Player 3D Sleek Ship
        const shipGroup = new THREE.Group();
        const shipGeo = new THREE.ConeGeometry(0.65, 2.2, 4);
        shipGeo.rotateX(-Math.PI / 2);
        shipGeo.scale(1.2, 0.45, 1);
        const shipMat = new THREE.MeshStandardMaterial({ color: THEMES[0].ship, roughness: 0.3, metalness: 0.2 });
        const shipMesh = new THREE.Mesh(shipGeo, shipMat);
        shipGroup.add(shipMesh);
        shipGroup.position.set(0, 0.55, 0);
        scene.add(shipGroup);

        // Obstacle Pool
        const cubeGeo = new THREE.BoxGeometry(2.2, 2.2, 2.2);
        const cubes = [];
        const CUBE_COUNT = 130;
        const SPAWN_DEPTH = 150;

        for (let i = 0; i < CUBE_COUNT; i++) {
            const mat = new THREE.MeshStandardMaterial({
                color: THEMES[0].cubes[i % 3],
                roughness: 0.25,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(cubeGeo, mat);
            mesh.position.set((Math.random() - 0.5) * 90, 1.1, -20 - Math.random() * SPAWN_DEPTH);
            scene.add(mesh);
            cubes.push(mesh);
        }

        // Game State
        let isPlaying = false;
        let score = 0;
        let highScore = Number(localStorage.getItem('cubefield3d_best')) || 0;
        highscoreEl.textContent = Math.floor(highScore);

        let speed = 38;
        let lateralVelocity = 0;
        let currentThemeIndex = 0;
        const keys = { left: false, right: false };

        function applyTheme(index) {
            const t = THEMES[index % THEMES.length];
            scene.background.setHex(t.bg);
            scene.fog.color.setHex(t.fog);
            floorMat.color.setHex(t.floor);
            gridHelper.material.color.setHex(t.grid);
            shipMat.color.setHex(t.ship);
            bloomPass.strength = t.bloom;
            document.getElementById('hud').style.color = t.ui;

            cubes.forEach((cube, idx) => {
                cube.material.color.setHex(t.cubes[idx % t.cubes.length]);
            });
        }

        function resetGame() {
            score = 0;
            speed = 40;
            lateralVelocity = 0;
            currentThemeIndex = 0;
            applyTheme(0);

            shipGroup.position.x = 0;
            shipGroup.rotation.z = 0;
            camera.position.x = 0;
            camera.rotation.z = 0;

            cubes.forEach((cube) => {
                cube.position.x = (Math.random() - 0.5) * 95;
                cube.position.z = -35 - Math.random() * SPAWN_DEPTH;
            });

            isPlaying = true;
            overlay.classList.add('hidden');
        }

        function triggerGameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('cubefield3d_best', highScore);
                highscoreEl.textContent = highScore;
            }
            titleEl.textContent = 'CRASHED';
            subtitleEl.innerHTML = `Final Score: <strong>${Math.floor(score)}</strong>`;
            playBtn.textContent = 'PLAY AGAIN';
            overlay.classList.remove('hidden');
        }

        // Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
            if (!isPlaying && (e.key === 'Enter' || e.key === ' ')) resetGame();
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        window.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const x = e.touches[0].clientX;
            if (x < window.innerWidth / 2) keys.left = true;
            else keys.right = true;
        });

        window.addEventListener('touchend', () => {
            keys.left = false;
            keys.right = false;
        });

        playBtn.addEventListener('click', resetGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Main Animation Loop
        const clock = new THREE.Clock();
        applyTheme(0);

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            if (isPlaying) {
                // Accelerate & Update Score
                speed += delta * 1.15;
                score += speed * delta * 0.65;
                scoreEl.textContent = Math.floor(score);

                // Shift color theme every 500 points
                const targetTheme = Math.floor(score / 500);
                if (targetTheme !== currentThemeIndex) {
                    currentThemeIndex = targetTheme;
                    applyTheme(currentThemeIndex);
                }

                // Smooth Steering & Banking Tilt
                const steerAccel = 135;
                if (keys.left) lateralVelocity -= steerAccel * delta;
                if (keys.right) lateralVelocity += steerAccel * delta;
                lateralVelocity *= Math.pow(0.04, delta); // Smooth damping

                shipGroup.position.x += lateralVelocity * delta;
                gridHelper.position.x = Math.round(shipGroup.position.x / 4) * 4;
                floor.position.x = shipGroup.position.x;

                // Scroll Grid Forward
                gridHelper.position.z = (gridHelper.position.z + speed * delta) % 4;

                // Camera & Ship Tilt
                const targetRoll = -lateralVelocity * 0.014;
                shipGroup.rotation.z += (targetRoll - shipGroup.rotation.z) * 12 * delta;
                camera.position.x += (shipGroup.position.x - camera.position.x) * 10 * delta;
                camera.rotation.z = shipGroup.rotation.z * 0.45;

                // Move Cubes & Check Collisions
                for (let i = 0; i < cubes.length; i++) {
                    const cube = cubes[i];
                    cube.position.z += speed * delta;

                    // Recycle cube to horizon once it passes the camera
                    if (cube.position.z > 10) {
                        cube.position.z = -SPAWN_DEPTH - Math.random() * 20;
                        cube.position.x = shipGroup.position.x + (Math.random() - 0.5) * 95;
                    }

                    // 3D Bounding Box Collision Check
                    const dz = Math.abs(cube.position.z - shipGroup.position.z);
                    const dx = Math.abs(cube.position.x - shipGroup.position.x);
                    if (dz < 1.55 && dx < 1.35) {
                        triggerGameOver();
                        break;
                    }
                }
            } else {
                // Idle background flyover on title screen
                gridHelper.position.z = (gridHelper.position.z + 18 * delta) % 4;
                for (let i = 0; i < cubes.length; i++) {
                    cubes[i].position.z += 18 * delta;
                    if (cubes[i].position.z > 10) {
                        cubes[i].position.z = -SPAWN_DEPTH;
                    }
                }
            }

            composer.render();
        }

        animate();
    </script>
</body>
</html>
